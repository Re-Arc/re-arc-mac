name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test package
        run: make test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build app
        run: make app XCODEBUILD_FLAGS="CODE_SIGNING_ALLOWED=NO"
